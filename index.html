<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULEWORLD — Adversarial World Model of India's Shadow Financial Economy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body{background:#0f172a;color:#f8fafc;font-family:Inter,system-ui,sans-serif}
  .panel{background:#1e293b;border:1px solid #334155;border-radius:12px}
  .lever{accent-color:#06b6d4}
</style>
</head>
<body class="p-4">

<header class="max-w-7xl mx-auto mb-4 flex flex-wrap items-center gap-4">
  <h1 class="text-2xl font-extrabold">MULE<span class="text-cyan-400">WORLD</span></h1>
  <span class="text-sm text-slate-400">A world model of India's shadow financial economy — the adversary remembers, adapts, evolves.</span>
  <div class="ml-auto flex items-center gap-3 text-sm">
    <span class="font-mono text-cyan-400">DAY <span id="day">0</span></span>
    <button id="play" class="bg-cyan-500 text-slate-900 font-bold px-4 py-1.5 rounded">▶ Play</button>
    <button id="speed" class="bg-slate-700 px-3 py-1.5 rounded">1x</button>
    <button id="reset" class="bg-slate-700 px-3 py-1.5 rounded">↺ Reset</button>
    <label class="flex items-center gap-2 text-yellow-300"><input id="xray" type="checkbox" class="lever"> X-RAY (God View)</label>
  </div>
</header>

<div class="max-w-7xl mx-auto grid lg:grid-cols-3 gap-4">
  <div class="lg:col-span-2 panel p-2"><div id="graph" style="height:460px;background:#020617;border-radius:10px"></div></div>

  <div class="panel p-4 space-y-4">
    <h2 class="font-bold text-cyan-400">OPERATOR CONSOLE — Defense Levers</h2>
    <div>
      <label class="text-xs text-slate-400">Freeze threshold: <span id="th-val">0.70</span></label>
      <input id="th" type="range" min="0.5" max="0.95" step="0.05" value="0.7" class="lever w-full">
    </div>
    <label class="flex items-center gap-2 text-sm"><input id="u30" type="checkbox" class="lever"> U30 Disruption (soft-decline screens)</label>
    <label class="flex items-center gap-2 text-sm"><input id="dpip" type="checkbox" class="lever"> DPIP Regulatory Feed (instant seeds)</label>
    <div>
      <label class="text-xs text-slate-400">Bank webhook coverage: <span id="cov-val">60%</span></label>
      <input id="cov" type="range" min="0" max="1" step="0.1" value="0.6" class="lever w-full">
    </div>
    <h2 class="font-bold text-cyan-400 pt-2">WORLD EVENT LOG</h2>
    <div id="log" class="h-56 overflow-y-auto text-xs font-mono space-y-1"></div>
  </div>
</div>

<div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-4 mt-4">
  <div class="panel p-4"><h3 class="text-sm font-bold mb-2">Daily Fraud Loss (₹) reaching coordinators</h3><canvas id="chartLoss"></canvas></div>
  <div class="panel p-4"><h3 class="text-sm font-bold mb-2">Detection rate % vs Frozen accounts</h3><canvas id="chartDet"></canvas></div>
</div>

<script>
// ================= SEEDED RNG =================
let seed = 42;
function rng(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
function ri(n){ return Math.floor(rng()*n); }

// ================= WORLD STATE =================
const BANKS=10, byId={};
let AID=0;
const S={ day:0, agents:[], txns:[], recent:[], rings:[], metrics:[], running:false, speed:1,
  levers:{ th:0.7, u30:false, dpip:false, cov:0.6 } };

function addAgent(type,bank,ringId){ const a={id:'A'+(AID++),type,bank,ringId:ringId||null,frozen:false,frozenDay:0,flagged:0}; S.agents.push(a); byId[a.id]=a; return a; }

function genWorld(){
  S.agents.length=0; S.txns.length=0; S.rings.length=0; S.metrics.length=0; S.recent.length=0; S.day=0;
  for(const k in byId) delete byId[k];
  for(let i=0;i<40;i++) addAgent(rng()<0.6?'family':'merchant', ri(BANKS));
  for(let i=0;i<15;i++) addAgent('victim', ri(BANKS));
  for(let r=0;r<3;r++){
    const ring={ id:'C-0'+(7+r), behavior:{structuring:false,synthetic:false,cash:false,dark:false}, members:[] };
    ring.members.push(addAgent('coordinator',ri(BANKS),ring.id));
    ring.members.push(addAgent('collector',ri(BANKS),ring.id));
    ring.members.push(addAgent('relay',ri(BANKS),ring.id));
    ring.members.push(addAgent('relay',ri(BANKS),ring.id));
    ring.members.push(addAgent('cashout',ri(BANKS),ring.id));
    S.rings.push(ring);
  }
  log('World generated: 3 rings (C-07, C-08, C-09), 55 normals, 15 victims.','slate');
}

function covered(a){ return a.bank < Math.floor(S.levers.cov*BANKS); }

// ================= TICK (1 simulated day) =================
function tick(){
  S.day++;
  const T=[];
  const normals=S.agents.filter(a=>a.type==='family'||a.type==='merchant');
  for(let i=0;i<25;i++){ const a=normals[ri(normals.length)], b=normals[ri(normals.length)];
    if(a!==b) T.push({day:S.day,from:a.id,to:b.id,amount:500+rng()*9500,ring:null,visible:true}); }

  for(const ring of S.rings){
    if(rng()>=0.8) continue;
    const victims=S.agents.filter(a=>a.type==='victim'&&!a.frozen);
    const v=victims[ri(victims.length)]; if(!v) continue;
    const relays=ring.members.filter(m=>m.type==='relay'&&!m.frozen);
    const coll=ring.members.find(m=>m.type==='collector'&&!m.frozen);
    const cash=ring.members.find(m=>m.type==='cashout'&&!m.frozen);
    const coord=ring.members.find(m=>m.type==='coordinator');
    if(!coll||!cash||relays.length===0) continue;
    const path=[v,coll,...relays.slice(0,ring.behavior.dark?1:2),cash,coord];
    const splits=ring.behavior.structuring?4:1;
    const base=(40000+rng()*60000)/splits;
    for(let s=0;s<splits;s++){
      let amt=base*0.97, cur=path[0];
      for(let h=1;h<path.length;h++){ const nxt=path[h];
        T.push({day:S.day,from:cur.id,to:nxt.id,amount:amt,ring:ring.id,visible:covered(cur)&&covered(nxt)});
        amt*=0.97; cur=nxt; }
    }
  }
  S.txns.push(...T); S.recent=T;
  detect(); adapt(); metrics(); render();
  document.getElementById('day').textContent=S.day;
}

// ================= DETECTION: label propagation on VISIBLE txns =================
function detect(){
  const win=S.txns.filter(t=>t.visible && S.day-t.day<7);
  const adj={};
  win.forEach(t=>{ (adj[t.from]=adj[t.from]||new Set()).add(t.to); (adj[t.to]=adj[t.to]||new Set()).add(t.from); });
  const label={}; Object.keys(adj).forEach((n,i)=>label[n]=i);
  for(let it=0;it<5;it++) for(const n in adj){
    const c={}; adj[n].forEach(m=>c[label[m]]=(c[label[m]]||0)+1);
    let best=label[n],bc=0; for(const k in c) if(c[k]>bc){bc=c[k];best=k;} label[n]=best;
  }
  const coms={}; for(const n in label)(coms[label[n]]=coms[label[n]]||[]).push(n);
  for(const c in coms){
    const m=coms[c]; if(m.length<4) continue;
    const ringN=m.filter(id=>byId[id]&&byId[id].ringId).length;
    if(ringN/m.length>0.5){
      m.forEach(id=>{ const a=byId[id]; if(a) a.flagged=Math.min(1,a.flagged+0.3);
        if(S.levers.dpip&&a&&a.ringId) a.flagged=1; });   // DPIP = instant seeds
    }
  }
  S.agents.forEach(a=>{
    if(!a.frozen && a.type!=='victim' && a.flagged>=S.levers.th){
      a.frozen=true; a.frozenDay=S.day;
      log('Day '+S.day+' FREEZE '+a.id+' ('+a.type+') risk '+a.flagged.toFixed(2), a.ringId?'red':'orange');
    }
  });
}

// ================= ADAPTATION ENGINE (the world fights back) =================
function adapt(){
  if(S.day%10!==0) return;
  const fr=S.agents.filter(a=>a.frozen&&S.day-a.frozenDay<10).length/15;
  for(const ring of S.rings){
    if(ring.members.filter(m=>!m.frozen).length<3){
      const nr=addAgent('relay',ri(BANKS),ring.id); ring.members.push(nr);
      log('Day '+S.day+' '+ring.id+' recruited NEW mule — burned accounts remembered, never reused.','purple');
    }
    if(fr>0.3&&!ring.behavior.structuring){ ring.behavior.structuring=true; log('Day '+S.day+' '+ring.id+' ADAPTS: splitting amounts below reporting threshold.','yellow'); }
    if(S.levers.u30&&!ring.behavior.synthetic){ ring.behavior.synthetic=true; log('Day '+S.day+' '+ring.id+' ADAPTS: U30 pressure → synthetic-KYC recruitment.','yellow'); }
    if(S.levers.dpip&&!ring.behavior.cash){ ring.behavior.cash=true; log('Day '+S.day+' '+ring.id+' ADAPTS: DPIP pressure → extra hop + cash cashout.','yellow'); }
    if(S.levers.cov<0.5&&!ring.behavior.dark){ ring.behavior.dark=true; log('Day '+S.day+' '+ring.id+' ADAPTS: routing via non-participating banks (dark hops).','yellow'); }
  }
  // EXTEND TOMORROW: call narrative layer here (Claude) with last 10 log lines.
}

// ================= METRICS =================
function metrics(){
  const loss=S.recent.filter(t=>t.ring&&byId[t.to].type==='coordinator').reduce((s,t)=>s+t.amount,0);
  const det=S.rings.filter(r=>r.members.some(m=>m.flagged>0)).length;
  S.metrics.push({day:S.day, loss, detPct:Math.round(det/S.rings.length*100),
    frozen:S.agents.filter(a=>a.frozen&&a.ringId).length, fp:S.agents.filter(a=>a.frozen&&!a.ringId&&a.type!=='victim').length});
}

// ================= UI =================
const COLORS={victim:'#3b82f6',collector:'#eab308',relay:'#eab308',cashout:'#ef4444',coordinator:'#9333ea',family:'#475569',merchant:'#475569'};
let network, nodesDS, edgesDS, chartLoss, chartDet;
function initUI(){
  nodesDS=new vis.DataSet(); edgesDS=new vis.DataSet();
  network=new vis.Network(document.getElementById('graph'),{nodes:nodesDS,edges:edgesDS},
    {physics:{barnesHut:{gravitationalConstant:-4000,springLength:90}},interaction:{hover:true}});
  chartLoss=new Chart(document.getElementById('chartLoss'),{type:'line',
    data:{labels:[],datasets:[{label:'Fraud loss ₹',data:[],borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.15)',fill:true,tension:.3}]},
    options:{plugins:{legend:{labels:{color:'#94a3b8'}}},scales:{x:{ticks:{color:'#64748b'}},y:{ticks:{color:'#64748b'}}}}});
  chartDet=new Chart(document.getElementById('chartDet'),{type:'line',
    data:{labels:[],datasets:[
      {label:'Detection %',data:[],borderColor:'#06b6d4',tension:.3},
      {label:'Mules frozen',data:[],borderColor:'#a855f7',tension:.3},
      {label:'False positives',data:[],borderColor:'#f97316',tension:.3}]},
    options:{plugins:{legend:{labels:{color:'#94a3b8'}}},scales:{x:{ticks:{color:'#64748b'}},y:{ticks:{color:'#64748b'}}}}});
}
function render(){
  const xray=document.getElementById('xray').checked;
  nodesDS.clear(); edgesDS.clear();
  S.agents.forEach(a=>{ nodesDS.add({id:a.id,label:a.id,shape:a.type==='coordinator'?'star':'dot',
    size:a.type==='coordinator'?22:12,
    color:{background:a.frozen?'#334155':COLORS[a.type],border:a.flagged>=S.levers.th?'#ef4444':'#0f172a'},
    font:{color:'#94a3b8',size:9}}); });
  S.recent.forEach(t=>{
    if(t.visible||xray) edgesDS.add({from:t.from,to:t.to,arrows:'to',
      dashes:(!t.visible&&xray), color:{color:t.visible?'#334155':'#b91c1c'}, width:t.ring?2:1});
  });
  const L=S.metrics.map(m=>m.day);
  chartLoss.data.labels=L; chartLoss.data.datasets[0].data=S.metrics.map(m=>m.loss); chartLoss.update('none');
  chartDet.data.labels=L;
  chartDet.data.datasets[0].data=S.metrics.map(m=>m.detPct);
  chartDet.data.datasets[1].data=S.metrics.map(m=>m.frozen);
  chartDet.data.datasets[2].data=S.metrics.map(m=>m.fp);
  chartDet.update('none');
}
function log(msg,color){ const d=document.getElementById('log');
  d.innerHTML='<div class="text-'+(color||'slate')+'-300">'+msg+'</div>'+d.innerHTML; }

// ================= CONTROLS =================
document.getElementById('play').onclick=e=>{ S.running=!S.running; e.target.textContent=S.running?'⏸ Pause':'▶ Play'; };
document.getElementById('speed').onclick=e=>{ S.speed=S.speed===1?4:1; e.target.textContent=S.speed+'x'; };
document.getElementById('reset').onclick=()=>{ genWorld(); render(); };
document.getElementById('th').oninput=e=>{ S.levers.th=+e.target.value; document.getElementById('th-val').textContent=S.levers.th.toFixed(2); };
document.getElementById('u30').onchange=e=>{ S.levers.u30=e.target.checked; log('Day '+S.day+' LEVER: U30 '+(S.levers.u30?'ON':'OFF'),'cyan'); };
document.getElementById('dpip').onchange=e=>{ S.levers.dpip=e.target.checked; log('Day '+S.day+' LEVER: DPIP '+(S.levers.dpip?'ON':'OFF'),'cyan'); };
document.getElementById('cov').oninput=e=>{ S.levers.cov=+e.target.value; document.getElementById('cov-val').textContent=Math.round(S.levers.cov*100)+'%'; };

initUI(); genWorld(); render();
setInterval(()=>{ if(S.running) tick(); }, 600/S.speed);
</script>
</body>
</html>
